spring:
  application:
    name: qazan-backend
  profiles:
    # Seeders with known passwords run only under "dev", which must be asked for.
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qazan}
    username: ${DB_USER:qazan}
    password: ${DB_PASSWORD:qazan}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    cache-duration: PT1H
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
  forward-headers-strategy: framework

# ── Application-specific ──────────────────────────────────────
app:
  jwt:
    issuer: qazan-backend
    secret: ${JWT_SECRET:dev-only-secret-please-replace-with-256-bit-key-in-production-env-var}
    access-token-ttl: PT15M
    refresh-token-ttl: P30D
  cors:
    # Dev default allows any localhost / 127.0.0.1 port (Flutter web picks
    # a random port). Tighten in prod via CORS_ORIGINS env var.
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://10.0.2.2:*}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  default-locale: az
  supported-locales: az,en,ru,tr

qazan:
  legal:
    # Shown on /legal/privacy, /legal/terms, /legal/delete-account. Until set,
    # the pages show a visible "to be completed" marker instead of a value.
    entity: ${QAZAN_LEGAL_ENTITY:}
    email: ${QAZAN_LEGAL_EMAIL:}
    address: ${QAZAN_LEGAL_ADDRESS:}
    effective-date: ${QAZAN_LEGAL_DATE:}
  social:
    google-client-ids: ${GOOGLE_CLIENT_IDS:}
    apple-client-ids: ${APPLE_CLIENT_IDS:}
    apple:
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key-file: ${APPLE_PRIVATE_KEY_FILE:}
  coins:
    max-grant: ${QAZAN_COINS_MAX_GRANT:10000}
  rate-limit:
    per-minute: ${QAZAN_RATE_LIMIT_PER_MINUTE:20}
  push:
    fcm:
      # Phone notifications. Needs a Firebase service-account JSON, given
      # as a file path (preferred) or inline; see gazan-mobile/PUSH_SETUP.md.
      enabled: ${FCM_ENABLED:false}
      credentials-file: ${FCM_CREDENTIALS_FILE:}
      credentials-json: ${FCM_CREDENTIALS_JSON:}

# ── Actuator ──────────────────────────────────────────────────
management:
  health:
    # An unreachable mail server must not mark the whole app as down.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        # metrics removed: it was readable by any signed-in user.
        include: health,info
  endpoint:
    health:
      show-details: never

# ── OpenAPI / Swagger UI ─────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
    operations-sorter: alpha
    tags-sorter: alpha

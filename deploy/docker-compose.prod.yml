services:
  postgres:
    image: postgres:16-alpine
    container_name: qazan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: qazan
      POSTGRES_USER: qazan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - qazan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qazan -d qazan"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: qazan-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/qazan
      DB_USER: qazan
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Empty by default: the web app is served from the same origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SERVER_PORT: "8080"
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      QAZAN_LEGAL_ENTITY: ${QAZAN_LEGAL_ENTITY:-}
      QAZAN_LEGAL_EMAIL: ${QAZAN_LEGAL_EMAIL:-}
      QAZAN_LEGAL_ADDRESS: ${QAZAN_LEGAL_ADDRESS:-}
      QAZAN_LEGAL_DATE: ${QAZAN_LEGAL_DATE:-}
      FCM_CREDENTIALS_JSON: ${FCM_CREDENTIALS_JSON:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_SMTP_STARTTLS:-true}
      QAZAN_MAIL_FROM: ${QAZAN_MAIL_FROM:-no-reply@qazan.az}
    expose:
      - "8080"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: qazan-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  qazan_pg_data:
